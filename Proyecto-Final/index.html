<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prediccion de Riesgo de Burnout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4 mb-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Sistema de Prediccion de Burnout en Estudiantes</h3>
                    <p class="mb-0 small">Ingrese las 19 caracteristicas del estudiante</p>
                </div>
                <div class="card-body">

                    <form id="formularioPrediccion">
                        <!-- Fila 1: age y gender -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">1. Edad (age):</label>
                                <input type="number" class="form-control" name="age" step="1" min="17" max="29" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">2. Genero (gender):</label>
                                <select class="form-select" name="gender" required>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <!-- Fila 2: academic_year y study_hours_per_day -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">3. Año academico (academic_year):</label>
                                <input type="number" class="form-control" name="academic_year" step="1" min="1" max="4" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">4. Horas de estudio por dia (study_hours_per_day):</label>
                                <input type="number" class="form-control" name="study_hours_per_day" step="0.5" min="0" max="14" required>
                            </div>
                        </div>

                        <!-- Fila 3: importancia examen (exam_pressure) y academic_performance -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">5. Importancia del examen (rigor) [1-10]:</label>
                                <input type="number" class="form-control" name="exam_pressure" step="0.1" min="1" max="10" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">6. Rendimiento academico (academic_performance) [0-100]:</label>
                                <input type="number" class="form-control" name="academic_performance" step="0.1" min="0" max="100" required>
                            </div>
                        </div>

                        <!-- Fila 4: stress_level y anxiety_score -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">7. Nivel de estres (stress_level) [0-10]:</label>
                                <input type="number" class="form-control" name="stress_level" step="0.1" min="0" max="10" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">8. Nivel de ansiedad (anxiety_score) [0-10]:</label>
                                <input type="number" class="form-control" name="anxiety_score" step="0.1" min="0" max="10" required>
                            </div>
                        </div>

                        <!-- Fila 5: depression_score y sleep_hours -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">9. Puntaje de depresion (depression_score) [0-10]:</label>
                                <input type="number" class="form-control" name="depression_score" step="0.1" min="0" max="10" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">10. Horas de sueno por noche (sleep_hours) [3-10]:</label>
                                <input type="number" class="form-control" name="sleep_hours" step="0.5" min="3" max="10" required>
                            </div>
                        </div>

                        <!-- Fila 6: physical_activity y social_support -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">11. Actividad fisica semanal (physical_activity) [horas]:</label>
                                <input type="number" class="form-control" name="physical_activity" step="0.5" min="0" max="7" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">12. Apoyo social recibido (social_support) [0-10]:</label>
                                <input type="number" class="form-control" name="social_support" step="0.1" min="0" max="10" required>
                            </div>
                        </div>

                        <!-- Fila 7: screen_time y internet_usage -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">13. Tiempo de pantalla diario (screen_time) [horas]:</label>
                                <input type="number" class="form-control" name="screen_time" step="0.5" min="1" max="12" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">14. Uso de internet diario (internet_usage) [horas]:</label>
                                <input type="number" class="form-control" name="internet_usage" step="0.5" min="1" max="14" required>
                            </div>
                        </div>

                        <!-- Fila 8: financial_stress y family_expectation -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">15. Estres financiero (financial_stress) [0-10]:</label>
                                <input type="number" class="form-control" name="financial_stress" step="0.1" min="0" max="10" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">16. Expectativas familiares (family_expectation) [0-10]:</label>
                                <input type="number" class="form-control" name="family_expectation" step="0.1" min="0" max="10" required>
                            </div>
                        </div>

                        <!-- Fila 9: burnout_score y mental_health_index -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">17. Nivel de agotamiento (burnout_score) [0-10]:</label>
                                <input type="number" class="form-control" name="burnout_score" step="0.1" min="0" max="10" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">18. Indice de salud mental (mental_health_index) [0-10]:</label>
                                <input type="number" class="form-control" name="mental_health_index" step="0.1" min="0" max="10" required>
                            </div>
                        </div>

                        <!-- Fila 10: dropout_risk (riesgo abandonar clase) -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">19. Riesgo de abandonar la clase (dropout_risk) [0-10]:</label>
                                <input type="number" class="form-control" name="dropout_risk" step="0.1" min="0" max="10" required>
                            </div>
                            <div class="col-md-6"></div>
                        </div>

                        <!-- Botón de envío: ahora type="submit" -->
                            <div class="d-grid mt-3">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Predecir riesgo
                                </button>
                            </div>
                        </form>

                    <!-- Área donde se mostrará el resultado de la API -->
                    <div id="resultadoArea" class="mt-4" style="display: none;"></div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Enlace al archivo JavaScript externo -->
    <script src="script.js"></script>

</body>
</html>
